;
; Asterisk configuration file
;
; Module Loader configuration file
;

[modules]
autoload=yes
;
; REGLA: cada "require =" de abajo vive en TRES lugares que se mueven juntos, porque un
; require que falta no degrada nada: Asterisk sale con codigo 2 y el contenedor queda en
; crash-loop, o sea la central entera sin telefonos.
;   1) aca;
;   2) la lista de REQUERIDOS del gate de docker/images/asterisk/Dockerfile (corta el build);
;   3) la lista de REQUERIDOS de docker/images/asterisk/docker-entrypoint.sh (avisa al arrancar).
; Si queda solo aca, el build sale verde sobre una imagen que no levanta (asi se escapo
; func_hangupcause.so). Y solo se agrega un modulo visto cargado en la central
; (module show like … -> Running).
;
; El dialplan (extensions.conf, paso "wake" de los internos) arma una URL con datos
; que manda el telefono y la pide con CURL: sin URIENCODE la query se puede alterar y
; sin CURL el despertar de softphones apagados no anda. Con autoload=yes se cargan
; igual; el require hace que un build sin ellos falle al arrancar en vez de en silencio.
require = func_curl.so
require = func_uri.so        ; URIENCODE/URIDECODE viven en func_uri.so (no existe func_uriencode.so)
;
; Telefonia clasica (1.9.0): las banderas de no molestar, desvios y sigueme viven en la AstDB
; (DB/DB_EXISTS = func_db.so) y las ramas de horario/feriado de las rutas entrantes que genera
; el panel comparan la fecha de hoy con STRFTIME, que junto con FILTER (el que limpia el
; timeout de sigueme en _[1-9]XXX) vive en func_strings.so: un solo require cubre los dos.
; OJO: no existe ningun func_strftime.so; pedirlo por nombre dejaba a Asterisk saliendo con
; codigo 2 al arrancar. Sin estos dos modulos el dialplan no falla: devuelve vacio, o sea que
; TODO desvio queda apagado y TODA llamada entra como si fuera horario de oficina. Preferimos
; que el arranque falle a que la central mienta.
require = func_db.so
require = func_strings.so
;
; Marcacion (sprint 7): el dial-by-name es Directory() -> app_directory.so, y tanto la DISA
; como el callback leen el PIN y el numero con Read() -> app_read.so. Con autoload=yes se
; cargan igual; el require es para que una imagen construida sin ellos falle AL ARRANCAR y
; no en medio de una llamada. Sin ellos el sintoma es una DISA o un directorio que atienden
; y cortan sin decir nada, que es de lo mas caro de diagnosticar por telefono.
require = app_directory.so
require = app_read.so
;
; Failover de troncales (sprint 8): la escalera que genera trunks.js para cada ruta saliente
; con respaldos usa la aplicacion HangupCauseClear y las funciones HANGUPCAUSE/HANGUPCAUSE_KEYS,
; que viven las tres en func_hangupcause.so. Sin ese modulo el HangupCauseClear corta la llamada
; con "no such application" y, peor, la causa 21 del intento anterior nunca se limpia: el 603
; Decline del destino se confundiria con un rechazo de la troncal y la central se iria al
; respaldo marcando de nuevo un numero que ya contesto que no. Verificado que existe y carga
; (module show like hangupcause -> Running) antes de ponerlo aca: el require hace que Asterisk
; salga con codigo 2 si el modulo falta, asi que aca solo van los que uno vio cargados.
require = func_hangupcause.so
;
; Any modules that need to be loaded before the Asterisk core has been
; initialized (just after the logger initialization) can be loaded
; using 'preload'.  'preload' forces a module and the modules it
; is known to depend upon to be loaded earlier than they normally get
; loaded.
;
; NOTE: There is no good reason left to use 'preload' anymore.  It was
; historically required to preload realtime driver modules so you could
; map Asterisk core configuration files to Realtime storage.
; This is no longer needed.
;
;preload = your_special_module.so
;
; If you want Asterisk to fail if a module does not load, then use
; the "require" keyword. Asterisk will exit with a status code of 2
; if a required module does not load.
;
;require = chan_pjsip.so
;
; If you want you can combine with preload
; preload-require = your_special_module.so
;
;load = res_musiconhold.so
;
; Load one of: console (portaudio).
; By default, load chan_console only (automatically).
;
;noload = chan_console.so
;
; Do not load res_hep and kin unless you are using HEP monitoring
; <http://sipcapture.org> in your network.
;
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
;
; Load one of the voicemail modules as they are mutually exclusive.
; By default, load app_voicemail only (automatically).
;
;noload = app_voicemail.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

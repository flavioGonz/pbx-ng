; Servidor HTTP de Asterisk: ARI (la API) y el WebSocket de PJSIP (transport-ws, WebRTC).
; bindaddr queda en 0.0.0.0 a propósito: Asterisk corre en host network y la API en un
; contenedor bridge, así que llega por la IP LAN del host (ASTERISK_HOST); 127.0.0.1 la
; dejaría afuera. TLS acá tampoco sirve sin un certificado real (el WSS lo termina el proxy).
; Quién puede llegar a 8088 lo decide nftables en el host (tabla inet pbxng, reglas
; "pbxng-mgmt": sólo redes privadas, salvo {"ari_public": true} en /etc/pbxng/fw.json).
; Ver docs/FIREWALL.md §1.2.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

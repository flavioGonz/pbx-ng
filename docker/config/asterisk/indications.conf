; PBX-NG · Zonas de tono (indications.conf)
;
; POR QUE ESTE ARCHIVO: sin el, la tabla de zonas de Asterisk queda vacia ("indication show"
; no lista nada y el arranque dice "Can't find indications config file") y la central no
; puede generar NINGUN tono por audio. Mientras el canal no esta atendido no se nota: el 180
; llega al telefono de quien llama y el telefono arma su propio tono. Pero sobre un canal
; ya atendido (una llamada que atendio la IA, una transferencia ciega) ast_indicate(RINGING)
; no manda 180 —chan_pjsip lo manda solo antes de atender— y el core tiene que generar el
; tono con la zona. Sin zona: silencio. Asi se cortaban las derivaciones de la IA (29/09):
; quien llama no escuchaba nada y el softphone del panel colgaba a los ~8 s.
;
; EL PAIS: el de [general] es el de fabrica. El entrypoint lo cambia al arrancar con la
; variable TONE_COUNTRY del compose (docker/.env), siempre que la zona exista en este
; archivo; si no existe, avisa y deja el pais que ya tenia el archivo. Para agregar un
; pais, se suma su seccion aca y se reconstruye la imagen.
;
; Efecto lateral, aceptado: con las zonas cargadas tambien pasan a sonar Busy(),
; Congestion() y las demas indicaciones sobre canales atendidos, que antes eran silencio.
;
; Formato: frecuencia[/duracion ms], separados por coma; 0 es silencio. Un tono sin
; duracion suena continuo. Van solo los tonos que usa la central (dial, ring, busy,
; congestion): el que falte en una zona simplemente no suena.

[general]
country=uy

; FUENTE de las dos zonas: UIT-T, Anexo al Boletin de Explotacion N.o 781 (1.II.2003),
; "Various tones used in national networks"
; (https://www.itu.int/ITU-T/inr/forms/files/tones-0203.pdf). Cadencias en segundos, como
; las da la UIT; aca van en milisegundos. No se tomaron de dahdi-tools/zonedata.c, que
; para Argentina difiere de la UIT.

; Uruguay (UIT OB 781): 425 Hz. Invitacion a marcar continua; llamada 1,0 on / 4,0 off;
; ocupado 0,5 / 0,5; congestion 0,25 / 0,25.
[uy]
description = Uruguay
ringcadence = 1000,4000
dial = 425
ring = 425/1000,0/4000
busy = 425/500,0/500
congestion = 425/250,0/250

; Argentina (UIT OB 781): 425 Hz. Invitacion a marcar continua; llamada 1,0 on / 4,0 off;
; ocupado 0,3 / 0,2; congestion 0,3 / 0,4.
[ar]
description = Argentina
ringcadence = 1000,4000
dial = 425
ring = 425/1000,0/4000
busy = 425/300,0/200
congestion = 425/300,0/400

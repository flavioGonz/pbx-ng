;==============================================================
; PBX-NG extensions.conf  (hibrido estatico + realtime)
;==============================================================
[general]
static=yes
writeprotect=no

[ivr]
switch => Realtime

[from-trunk]
include => ivr
; Las rutas entrantes (DID) se generan en realtime desde el panel.
switch => Realtime
exten => i,1,NoOp(DID sin ruta entrante)
 same => n,Hangup()
exten => s,1,Goto(from-trunk,i,1)

[internal]
include => ivr
; El contexto de las llamadas aparcadas: sin esto, recuperar una llamada desde un
; interno no funciona (las plazas viven en su propio contexto).
include => parkedcalls

; --- Captura de llamada (pickup) ---
; *8        -> atiende el telefono que esta sonando en TU grupo de captura
; **<int>   -> atiende el de ESE interno en concreto (captura dirigida)
exten => *8,1,NoOp(Captura de grupo)
 same => n,PickupChan(PJSIP/${EXTEN})
 same => n,Pickup()
 same => n,Hangup()
exten => _**.,1,NoOp(Captura dirigida a ${EXTEN:2})
 same => n,PickupChan(PJSIP/${EXTEN:2})
 same => n,Hangup()

; --- Aparcado de llamadas ---
; Transferi la llamada a 700 y Asterisk te dice en que plaza quedo (701, 702...).
; Para recuperarla, marca esa plaza desde cualquier interno.
; El lote (numero, rango y tiempo) se configura desde el panel: res_parking.conf
; incluye pbxng.d/parking.conf, que genera el panel.
exten => 700,1,NoOp(Aparcar llamada)
 same => n,Park()
 same => n,Hangup()

; --- Codigos de funcion (estaticos, audio en espanol) ---
exten => *43,1,NoOp(Prueba de eco)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()
exten => *44,1,NoOp(Prueba de audio en espanol)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
exten => *65,1,NoOp(Decir mi numero)
 same => n,Answer()
 same => n,Wait(1)
 same => n,SayDigits(${CALLERID(num)})
 same => n,Hangup()
; --- Buzon de voz ---
; *97 = MI buzon. Este contexto solo lo alcanzan endpoints PJSIP autenticados (from-trunk
; nunca incluye internal), pero CALLERID(num) es lo que el telefono manda en el From: un
; interno registrado podria poner el numero de otro y entrar a su buzon si saltaramos la
; clave con ese dato. Por eso la identidad sale de CHANNEL(endpoint) (el endpoint que
; autentico, cuyo id es el interno = mailbox) y la 's' (sin clave) se usa SOLO cuando el
; canal es PJSIP; un canal Local/otro (Originate, c2c) cae al camino con clave.
exten => *97,1,NoOp(Mi buzon de voz)
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${CHANNEL(channeltype)}" = "PJSIP"]?propio:conclave)
 same => n(propio),VoiceMailMain(${CHANNEL(endpoint)}@default,s)
 same => n,Hangup()
 same => n(conclave),VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()
; *98 = buzon de OTRO: pide mailbox y clave. NUNCA lleva la opcion 's' (skip password):
; seria dejar todos los buzones abiertos a cualquier interno.
exten => *98,1,NoOp(Buzon de otro)
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMailMain(@default)
 same => n,Hangup()
exten => 600,1,Goto(*43,1)
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Hangup()
; --- Internos 1XXX / 9XXX: no molestar, desvios, sigueme y buzon ---
;
; Por que todas estas banderas se leen de la AstDB (familias dnd/cfu/cfb/cfnr/fm/fmt) y no de
; PostgreSQL: la fuente de verdad ES Postgres, pero el dialplan no puede consultarla en cada
; llamada sin pagar una consulta por timbrazo, y estas banderas las cambia el usuario todo el
; tiempo (desde el telefono con un codigo de funcion o desde el panel). La API vuelca
; Postgres -> AstDB al arrancar (syncFeatures) y en cada cambio, igual que ya hace con
; rec/<ext>: asi Asterisk lee un valor local en memoria y cambiar un desvio no obliga a
; recargar el dialplan ni a reconstruir esta imagen.
exten => _[1-9]XXX,1,NoOp(Llamando interno ${EXTEN})
 same => n,GotoIf($[${DIALPLAN_EXISTS(ivr,${EXTEN},1)}]?ivr,${EXTEN},1)
 same => n,Set(DIALEDEXT=${EXTEN})
 ; Guardia de bucle: un desvio manda al interno de al lado y ese devuelve al primero. Sin
 ; esto la llamada gira hasta que alguien cuelga; a los 5 saltos cortamos por el buzon.
 ;
 ; POR QUE `__SALTOS` Y NO `SALTOS`: los desvios (cfu/cfb/cfnr) son un Goto dentro de ESTE
 ; mismo canal y el contador seguia contando, pero el SIGUEME sale por un canal Local
 ; (Local/<destino>@internal, mas abajo) y un canal nuevo nace con las variables en cero.
 ; O sea que A con sigueme a B y B con sigueme a A se pasaban la llamada para siempre: cada
 ; salto era el "primer" salto de un canal recien nacido y este tope no lo veia nunca. Con
 ; el doble guion bajo la variable queda heredable y el Local se lleva el contador puesto,
 ; asi que el tope vale para la cadena entera y no por canal. La API ademas rechaza el ciclo
 ; al guardarlo (telefonia.js), pero eso solo agarra los ciclos que ya estan escritos: esto
 ; agarra los que se arman en el medio y cualquier cosa que escriba la AstDB sin pasar por
 ; la API. Se lee `${SALTOS}` a secas (el prefijo es solo para escribir).
 same => n,ExecIf($["${SALTOS}"=""]?Set(__SALTOS=0))
 same => n,Set(__SALTOS=$[${SALTOS} + 1])
 same => n,GotoIf($[${SALTOS} > 5]?internal,vm-NOANSWER,1)
 ; (1) No molestar: el telefono no suena, la llamada va derecho al buzon con el saludo de
 ; ocupado (opcion b), que es lo que espera quien llama a alguien en reunion.
 same => n,GotoIf($["${DB(dnd/${EXTEN})}"="1"]?internal,vm-DND,1)
 ; (2) Desvio incondicional: se resuelve ANTES de despertar y de marcar. El destino se manda
 ; al propio contexto internal, asi sirve igual un interno que un numero externo marcado por
 ; la ruta saliente que genera trunks.js (_0. y companiia).
 same => n,GotoIf($["${DB(cfu/${EXTEN})}"!=""]?cfu)
 same => n,Set(CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,GotoIf($["${CONTACTS}x" = "x"]?wake:dial)
 ; El CALLERID(num) lo pone el telefono: va URIENCODE para que un '&' o '#' no cambie
 ; la query (func_uriencode viene con autoload=yes en modules.conf).
 same => n(wake),Set(WAKE=${CURL(http://@@API_URL@@/api/internal/wake?ext=${URIENCODE(${EXTEN})}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,Set(TRIES=0)
 same => n(poll),Set(CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,GotoIf($["${CONTACTS}x" != "x"]?dial)
 same => n,Set(TRIES=$[${TRIES} + 1])
 same => n,GotoIf($[${TRIES} > 16]?dial)
 same => n,Wait(0.5)
 same => n,Goto(poll)
 same => n(dial),Set(DOREC=0)
 same => n,ExecIf($["${DB(rec/${EXTEN})}"="1"]?Set(DOREC=1))
 same => n,ExecIf($["${DB(rec/${CALLERID(num)})}"="1"]?Set(DOREC=1))
 same => n,ExecIf($["${DB(rec/_ALL_)}"="1"]?Set(DOREC=1))
 same => n,ExecIf($["${DOREC}"="1"]?MixMonitor(pbxng-${EXTEN}-${EPOCH}.wav,b))
 ; (3) Cuanto timbra el interno: los 25 s de siempre, salvo que haya sigueme. Con sigueme
 ; manda fmt/<ext> (default 15 s), para que quede tiempo de saltar al celular antes de que
 ; el que llama se canse. FILTER(0-9,...) deja solo digitos: si alguien escribio cualquier
 ; cosa en la AstDB, el Dial no se queda sin timeout.
 same => n,Set(TIMBRE=25)
 same => n,GotoIf($["${DB(fm/${EXTEN})}"=""]?marcar)
 same => n,Set(TIMBRE=${FILTER(0-9,${DB(fmt/${EXTEN})})})
 same => n,ExecIf($["${TIMBRE}"=""]?Set(TIMBRE=15))
 same => n,ExecIf($[${TIMBRE} < 5]?Set(TIMBRE=15))
 same => n,ExecIf($[${TIMBRE} > 120]?Set(TIMBRE=120))
 same => n(marcar),Dial(PJSIP/${EXTEN},${TIMBRE})
 ; (4) Segun como termino el Dial. Ocupado -> cfb; sin respuesta -> cfnr y, si no hay, sigueme.
 ; Todo lo demas (ANSWER, CANCEL, CONGESTION, CHANUNAVAIL) sigue cayendo en vm-${DIALSTATUS}
 ; exactamente como antes: vm-NOANSWER / vm-BUSY atienden, el resto lo come el patron _vm-.
 same => n,Set(FIN=${DIALSTATUS})
 same => n,GotoIf($["${FIN}"="BUSY"]?ocupado)
 same => n,GotoIf($["${FIN}"="NOANSWER"]?sinrespuesta)
 same => n,Goto(vm-${FIN},1)
 same => n(ocupado),GotoIf($["${DB(cfb/${EXTEN})}"=""]?internal,vm-BUSY,1)
 same => n,Goto(internal,${DB(cfb/${EXTEN})},1)
 same => n(sinrespuesta),GotoIf($["${DB(cfnr/${EXTEN})}"!=""]?cfnr)
 same => n,GotoIf($["${DB(fm/${EXTEN})}"=""]?internal,vm-NOANSWER,1)
 ; Sigueme: el destino es un numero EXTERNO, y la unica salida a la calle que conoce esta
 ; central son las rutas salientes que trunks.js deja como extensiones del propio contexto
 ; internal (_0. -> Dial(PJSIP/${EXTEN:n}@troncal)). Por eso se marca con un canal Local
 ; contra internal en vez de inventar aca una troncal: el numero guardado en fm/<ext> se
 ; marca como si lo hubiera marcado el interno, con su prefijo de salida y su CallerID.
 ; El /n (sin optimizar) mantiene el canal vivo para que el MixMonitor que ya arranco y el
 ; CDR sigan viendo la llamada. Si el celular no atiende o no hay ruta saliente que haga
 ; juego, caemos al buzon en vez de cortarle en la cara al que llamo.
 same => n,Dial(Local/${DB(fm/${EXTEN})}@internal/n,45)
 same => n,Goto(internal,vm-NOANSWER,1)
 same => n(cfnr),Goto(internal,${DB(cfnr/${EXTEN})},1)
 same => n(cfu),Goto(internal,${DB(cfu/${EXTEN})},1)
exten => vm-NOANSWER,1,VoiceMail(${DIALEDEXT}@default,u)
 same => n,Hangup()
exten => vm-BUSY,1,VoiceMail(${DIALEDEXT}@default,b)
 same => n,Hangup()
; Buzon por "no molestar". Va aparte de vm-BUSY para que se lea en el CDR y en el log por
; que no sono el telefono; el saludo es el mismo (b = busy) porque es el que corresponde.
; Extension explicita: gana contra el patron _vm-. de abajo.
exten => vm-DND,1,NoOp(No molestar activo en ${DIALEDEXT})
 same => n,VoiceMail(${DIALEDEXT}@default,b)
 same => n,Hangup()
exten => _vm-.,1,Hangup()
; reglas dinamicas (colas, conferencias, ring groups, salida troncal) en realtime
switch => Realtime

[c2c]
; Click-to-Call publico (invitados WebRTC efimeros) - rutas en realtime
switch => Realtime
exten => i,1,Hangup()

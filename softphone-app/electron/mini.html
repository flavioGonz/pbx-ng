<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- ============================================================================
     Softphone-NG · widget flotante.
     Es la ventanita siempre-arriba que queda cuando uno esconde el softphone y sigue
     trabajando en otra cosa. Tiene que decir el estado de un vistazo y dejar hacer lo
     unico urgente: atender, cortar, silenciar.

     POR QUE SE REHIZO: los botones no respondian. Toda la ventana era zona de ARRASTRE
     (-webkit-app-region: drag) y la fila de acciones la anulaba, pero el boton de
     expandir —y cualquier control fuera de esa fila— quedaba adentro del arrastre: al
     hacerle clic uno movia la ventana en vez de apretarlo. Ahora se arrastra SOLO por
     una franja propia y todo lo que se toca declara no-drag. De paso los botones pasaron
     de 30 a 34 px (un blanco de 30 px en una ventana flotante que ademas se mueve es
     chico) y los colores son los mismos que la pantalla de llamada, no otros parecidos.
============================================================================ -->
<style>
  :root{
    --fondo:#1f2229; --barra:#31333a; --linea:#4d4e54;
    --texto:#e9ebee; --suave:#c6cad0; --tenue:#8d929a;
    --verde:#2bd95a; --rojo:#eb4c46; --azul:#1a73f2; --ambar:#f0b429;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-user-select:none;cursor:default}
  .w{height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
     padding:9px 11px 11px;background:var(--fondo);color:var(--texto);
     border:1px solid rgba(255,255,255,.10);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.55);
     position:relative;overflow:hidden}
  /* La franja de arrastre: arriba, delgada, y NADA que se pueda tocar vive adentro. */
  .drag{position:absolute;top:0;left:0;right:0;height:9px;-webkit-app-region:drag}
  .top{display:flex;align-items:center;gap:9px;min-width:0}
  /* El orbe: mismo lenguaje que la pantalla de llamada, el color ES el estado. */
  .orbe{width:34px;height:34px;border-radius:50%;flex:none;position:relative;
        background:radial-gradient(circle at 34% 28%, #fff 0%, rgba(255,255,255,.55) 26%, var(--c,#4c9aff) 68%, rgba(0,0,0,.25) 100%);
        box-shadow:inset 0 -3px 8px rgba(0,0,0,.25)}
  .orbe.vivo{animation:lat 2.1s ease-in-out infinite}
  @keyframes lat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
       border:2px solid var(--fondo);background:#7c8794}
  .dot.on{background:var(--verde)}
  .info{flex:1;min-width:0}
  .num{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .sub{font-size:11.5px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       font-variant-numeric:tabular-nums}
  .sub.viva{color:var(--verde)}
  .pulse{animation:pl 1.3s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
  .row{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag}
  button{-webkit-app-region:no-drag;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
     display:flex;align-items:center;justify-content:center;flex:none;
     background:rgba(255,255,255,.10);color:var(--texto);transition:background .12s,transform .1s,color .12s}
  button:hover{background:rgba(255,255,255,.2)}
  button:active{transform:scale(.93)}
  button.chico{width:26px;height:26px;background:none;color:var(--tenue)}
  button.chico:hover{background:rgba(255,255,255,.12);color:var(--texto)}
  button.rojo{background:var(--rojo);color:#fff}button.rojo:hover{background:#d8413b}
  button.verde{background:var(--verde);color:#08240f}button.verde:hover{background:#25c451}
  button.azul{background:var(--azul);color:#fff}button.azul:hover{background:#155fd0}
  /* Encendido = fondo claro, como en la barra de la pantalla de llamada. */
  button.on{background:#fff;color:#1f2229}
  .vol{display:flex;align-items:center;gap:7px;flex:1;min-width:64px;-webkit-app-region:no-drag}
  .vol svg{flex:none;color:var(--tenue)}
  input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:4px;outline:none;-webkit-app-region:no-drag;
     background:linear-gradient(90deg,var(--verde) var(--p,70%),rgba(255,255,255,.16) var(--p,70%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
     background:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(43,217,90,.3)}
  /* Entrante: el borde late. Es el unico estado que se anuncia solo. */
  .w.timbra{border-color:rgba(43,217,90,.55);animation:glow 1.3s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 0 rgba(43,217,90,.4)}
                  50%{box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 9px rgba(43,217,90,0)}}
  @media (prefers-reduced-motion:reduce){ .w.timbra,.orbe.vivo,.pulse{animation:none} }
</style></head><body>
  <div class="w" id="w">
    <div class="drag"></div>
    <div class="top">
      <div class="orbe" id="orbe"><span class="dot" id="dot"></span></div>
      <div class="info"><div class="num" id="num">—</div><div class="sub" id="sub"></div></div>
      <button class="chico" id="exp" title="Abrir el softphone"></button>
    </div>
    <div class="row" id="row"></div>
  </div>
<script>
  const $ = (i) => document.getElementById(i);
  let st = null, iv = null;
  const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const P = {
    mic: '<path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/>',
    micoff: '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1"/><path d="M15 9.3V4a3 3 0 0 0-5.9-.7"/><path d="M19 10v1a7 7 0 0 1-.9 3.4"/><path d="M5 10v1a7 7 0 0 0 10.7 6"/><line x1="12" y1="19" x2="12" y2="23"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 4.2 2 2 0 0 1 5.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L9.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/>',
    max: '<polyline points="9 3 3 3 3 9"/><polyline points="15 21 21 21 21 15"/><line x1="3" y1="3" x2="10" y2="10"/><line x1="21" y1="21" x2="14" y2="14"/>',
    video: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
    dial: '<circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/>',
    head: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
    spk: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>',
    pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
    play: '<polygon points="6 4 20 12 6 20 6 4"/>'
  };
  const relleno = { dial: 1, pause: 1, play: 1 };
  const svg = (n, s) => '<svg width="' + (s || 16) + '" height="' + (s || 16) + '" viewBox="0 0 24 24" fill="' +
    (relleno[n] ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (P[n] || '') + '</svg>';

  function btn(cls, ic, title, act, rot) {
    const b = document.createElement('button');
    if (cls) b.className = cls;
    b.innerHTML = svg(ic); b.title = title; b.setAttribute('aria-label', title);
    if (rot) b.firstChild.style.transform = 'rotate(134deg)';
    b.onclick = (e) => { e.preventDefault(); try { window.sphone.miniAction(act); } catch (_) {} };
    return b;
  }
  function volCtl() {
    const wrap = document.createElement('div'); wrap.className = 'vol';
    wrap.innerHTML = svg('spk', 15);
    const r = document.createElement('input');
    r.type = 'range'; r.min = 0; r.max = 1; r.step = 0.05; r.title = 'Volumen del auricular';
    const v = (st && typeof st.volume === 'number') ? st.volume : 1;
    r.value = v; r.style.setProperty('--p', Math.round(v * 100) + '%');
    r.oninput = () => { r.style.setProperty('--p', Math.round(r.value * 100) + '%'); try { window.sphone.miniAction('volume', parseFloat(r.value)); } catch (_) {} };
    wrap.appendChild(r); return wrap;
  }
  function tick() {
    if (!st || !st.since) return;
    $('sub').textContent = fmt(Math.max(0, Math.floor((Date.now() - st.since) / 1000)));
  }
  /* El color del orbe ES el estado, igual que en la pantalla grande. */
  function colorDe(s) {
    if (!s || !s.active) return s && s.registered ? '#4c9aff' : '#7c8794';
    if (s.incoming) return '#2bd95a';
    if (s.held) return '#f0b429';
    return s.since ? '#1a73f2' : '#4c9aff';
  }
  function render() {
    const row = $('row'); row.innerHTML = '';
    const timbra = !!(st && st.active && st.incoming);
    $('w').classList.toggle('timbra', timbra);
    $('orbe').classList.toggle('vivo', !!(st && st.active));
    $('orbe').style.setProperty('--c', colorDe(st));
    $('exp').innerHTML = svg('max', 14);
    $('exp').onclick = () => { try { window.sphone.miniAction('restore'); } catch (_) {} };

    if (!st || !st.active) {
      const ext = (st && st.ext) || '';
      $('dot').className = 'dot' + ((st && st.registered) ? ' on' : '');
      $('num').textContent = ext ? ('Interno ' + ext) : 'Sin cuenta';
      $('sub').textContent = (st && st.registered) ? 'En línea · listo para llamar' : 'Sin conexión';
      $('sub').className = 'sub';
      row.appendChild(btn('', 'dial', 'Abrir el teclado', 'dial'));
      row.appendChild(btn('', 'head', 'Micrófono y auricular', 'devices'));
      row.appendChild(volCtl());
      return;
    }

    $('dot').className = 'dot on';
    $('num').textContent = st.name || st.number || '—';
    if (st.incoming) { $('sub').textContent = 'Llamada entrante…'; $('sub').className = 'sub pulse'; }
    else if (st.held) { $('sub').textContent = 'En espera'; $('sub').className = 'sub'; }
    else if (!st.since) { $('sub').textContent = 'Llamando…'; $('sub').className = 'sub'; }
    else { $('sub').className = 'sub viva'; tick(); }

    if (st.incoming) {
      row.appendChild(btn('rojo', 'phone', 'Rechazar', 'reject', true));
      if (st.video) row.appendChild(btn('azul', 'video', 'Atender con video', 'accept-video'));
      row.appendChild(btn('verde', 'phone', 'Atender', 'accept'));
      return;
    }
    row.appendChild(btn(st.muted ? 'on' : '', st.muted ? 'micoff' : 'mic', st.muted ? 'Activar el micrófono' : 'Silenciar el micrófono', 'mute'));
    row.appendChild(btn(st.held ? 'on' : '', st.held ? 'play' : 'pause', st.held ? 'Reanudar' : 'Poner en espera', 'hold'));
    row.appendChild(btn('rojo', 'phone', 'Terminar la llamada', 'hangup', true));
    row.appendChild(volCtl());
  }
  try {
    window.sphone.onMiniState((s) => {
      st = s; render();
      if (iv) { clearInterval(iv); iv = null; }
      if (st && st.since && !st.incoming) { tick(); iv = setInterval(tick, 500); }
    });
    window.sphone.miniReady();
  } catch (_) {}
  render();
</script>
</body></html>
